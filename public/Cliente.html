<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes - AutoFIX</title>

    <link rel="stylesheet" href="clientes.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        AUTOCENTER
    </div>

    <nav>
        <a href="../dasboard.html">Dashboard</a>
        <a href="../veiculos/veiculos.html">Veículos</a>
        <a href="../ordens/ordens.html">OS</a>
    </nav>

</header>

<main class="container">

    <div class="page-header">

        <div>
            <h1>Clientes</h1>
            <p>Gerenciamento de clientes.</p>
        </div>

        <button class="btn-primary" id="novoCliente">
            + Novo Cliente
        </button>

    </div>

    <section class="form-container" id="formContainer">

        <h2 id="formTitle">Novo Cliente</h2>

        <form id="clienteForm">

            <input type="hidden" id="clienteId">

            <div class="form-grid">

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email">
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    Salvar
                </button>

                <button type="button" class="btn-secondary" id="cancelar">
                    Cancelar
                </button>
            </div>

        </form>

    </section>

    <section class="list-container">

        <div class="search">

            <input
                type="text"
                id="busca"
                placeholder="Buscar por nome ou CPF..."
            >

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaClientes"></tbody>

            </table>

        </div>

    </section>

</main>

<script src="clientes.js"></script>

</body>
</html>
